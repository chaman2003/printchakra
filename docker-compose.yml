services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: printchakra-backend
    environment:
      PORT: 5000
      FLASK_ENV: production
      USE_HTTPS: 0
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:5000}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
      POPPLER_PATH: /usr/bin
      TESSERACT_CMD: /usr/bin/tesseract
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_LLM_MODEL: ${GROQ_LLM_MODEL:-llama-3.1-8b-instant}
      GROQ_STT_MODEL: ${GROQ_STT_MODEL:-whisper-large-v3-turbo}
      GROQ_TTS_MODEL: ${GROQ_TTS_MODEL:-canopylabs/orpheus-v1-english}
      GROQ_TTS_ENDPOINT: ${GROQ_TTS_ENDPOINT:-https://api.groq.com/openai/v1/audio/speech}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "5000:5000"
    volumes:
      - ./backend/public/data:/app/public/data
      - ./backend/logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000}
    container_name: printchakra-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped